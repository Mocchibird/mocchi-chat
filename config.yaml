# Mocchibird Bot Configuration

# Bot personality and behavior
bot:
  name: "mocchibird"
  description: "A friendly AI assistant Discord bot"
  
# System prompt for fine-tuning the bot's personality
system_prompt: |
  You are Mocchibird, a friendly and helpful AI assistant in a Discord server.
  You are knowledgeable, respectful, and always try to be helpful.
  Keep your responses conversational and engaging.
  If you don't know something, you admit it honestly.

# Model parameters for fine-tuning responses
model_parameters:
  temperature: 0.7  # Controls randomness (0.0 to 2.0)
  max_tokens: 500   # Maximum length of response
  top_p: 0.9        # Nucleus sampling parameter
  frequency_penalty: 0.0  # Penalize frequent tokens
  presence_penalty: 0.0   # Penalize tokens based on presence

# Context settings
context:
  max_history: 10  # Number of previous messages to include in context
  use_usernames: true  # Include usernames in context

# Response settings
response:
  typing_indicator: true  # Show typing indicator while generating response
  mention_user: true      # Mention the user in the response
  error_message: "Sorry, I encountered an error while processing your request. Please try again."
